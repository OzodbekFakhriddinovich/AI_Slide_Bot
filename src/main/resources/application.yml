spring:
  application:
    name: SlideBot

  main:
    web-application-type: servlet

  datasource:
    url: jdbc:postgresql://localhost:5432/Slide_Bot
    username: ${DB_USERNAME:slide_bot}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8089

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: AI_Slide_Assistant_Bot

payment:
  api-secret: ${PAYMENT_API_SECRET:}
  humo-card: ${PAYMENT_HUMO_CARD:}

fal:
  ai:
    key: ${FAL_API_KEY:}

gemini:
  api:
    model: ${GEMINI_API_MODEL:gemini-3.6-flash}
    keys: ${GEMINI_API_KEYS:}

logging:
  level:
    org.springframework: info
    uz.ai.slideshowbot: debug
