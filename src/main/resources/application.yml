spring:
  application:
    name: SlideBot

  datasource:
    url: jdbc:postgresql://localhost:5432/Slide_Bot
    username: slide_bot
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

telegram:
  bot:
    token:
    username: AI_Slide_Assistant_Bot

pixabay:
  api-key:


gemini:
  api-key:     # AI Studio → Gemini uchun

logging:
  level:
    org.springframework: info
    uz.ai.slideshowbot: debug